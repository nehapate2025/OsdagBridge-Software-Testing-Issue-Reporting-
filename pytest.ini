[pytest]
testpaths = tests
python_files = test_*.py verification_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Unit tests for isolated functions, validators, and classes
    integration: Integration tests between solvers, CLI, and APIs
    scenario: Design scenarios validating geometry, materials, and consecutive runs
    reporting: Tests for report generation, plotting, and evidence export
    blocked: Tests requiring external environment dependencies that are blocked when unavailable
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
